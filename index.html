<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanterninha</title>
<meta name="apple-mobile-web-app-title" content="Lanterninha">
<meta name="description" content="Perguntas rápidas pra decidir que nota dar a um filme no Letterboxd.">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0a0a0c; --card:#1a1a1d; --card2:#232327; --text:#f5f5f7; --muted:#8e8e93;
  --gold:#e3b468; --gold-soft:rgba(227,180,104,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 55% at 50% -10%,rgba(227,180,104,.13),transparent 60%)}
.app{position:relative;max-width:480px;min-height:100%;margin:0 auto;padding:18px 22px 34px;display:flex;flex-direction:column}
.top{height:44px;display:flex;align-items:center;gap:14px}
.back{width:36px;height:36px;border-radius:50%;border:none;background:var(--card);color:var(--text);font-size:20px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:opacity .3s,transform .15s}
.back:active{transform:scale(.9)}
.bar{flex:1;height:4px;border-radius:4px;background:var(--card2);overflow:hidden;transition:opacity .3s}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:4px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.hide{opacity:0;pointer-events:none}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 0 8px}
.screen{animation:in .45s cubic-bezier(.2,.8,.2,1) both}
.screen.out{animation:out .2s ease both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-12px)}}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.6px;margin:0 0 10px}
.q{font-size:29px;line-height:1.15;font-weight:700;letter-spacing:-.5px;margin:0 0 8px}
.sub{color:var(--muted);font-size:16px;line-height:1.4;margin:0 0 24px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{width:100%;text-align:left;padding:16px 20px;border-radius:16px;border:1.5px solid transparent;background:var(--card);
  color:var(--text);font:inherit;font-size:17px;font-weight:500;
  transition:transform .15s,background .2s,border-color .2s}
.opt:active{transform:scale(.97);background:var(--card2)}
.opt.on{border-color:var(--gold);background:var(--gold-soft)}
input[type=text]{width:100%;padding:17px 20px;border-radius:18px;border:1.5px solid transparent;background:var(--card);color:var(--text);
  font:inherit;font-size:17px;outline:none;transition:border-color .2s;margin-bottom:10px}
input[type=text]:focus{border-color:var(--gold)}
input::placeholder{color:#636366}
.sw{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-radius:18px;background:var(--card);
  font-size:17px;margin-bottom:14px;width:100%;border:none;color:var(--text);font-family:inherit;text-align:left}
.sw i{position:relative;width:51px;height:31px;border-radius:31px;background:#39393d;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.sw.on i{background:var(--gold)}
.sw.on i::after{transform:translateX(20px)}
.cta{width:100%;padding:17px;border-radius:18px;border:none;background:var(--gold);color:#1d1403;font:inherit;font-size:17px;font-weight:600;
  transition:transform .15s,opacity .2s}
.cta:active{transform:scale(.97);opacity:.9}
.center{text-align:center}
.film{color:var(--muted);font-size:15px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;margin-bottom:22px;min-height:18px}
.stars{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.star{position:relative;width:50px;height:50px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.star svg{position:absolute;inset:0;width:50px;height:50px}
.star .f{position:absolute;inset:0;overflow:hidden}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.num{font-size:64px;font-weight:700;letter-spacing:-2px;line-height:1}
.label{color:var(--gold);font-size:19px;font-weight:600;margin:8px 0 0}
.seal{display:inline-block;margin-top:14px;padding:8px 14px;border-radius:30px;background:var(--card);color:var(--text);font-size:14px;font-weight:500}
.adj{display:flex;align-items:center;justify-content:center;gap:18px;margin:28px 0}
.adj button{width:46px;height:46px;border-radius:50%;border:none;background:var(--card);color:var(--text);font-size:24px;transition:transform .15s}
.adj button:active{transform:scale(.88)}
.adj small{color:var(--muted);font-size:14px;width:120px}
.recent{margin-top:34px}
.recent h3{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin:0 0 8px}
.rc{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--card2);font-size:16px}
.rc:last-child{border:none}
.rc b{color:var(--gold);font-weight:500;white-space:nowrap;margin-left:12px}
.rc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc{width:100%;background:none;border-left:none;border-right:none;border-top:none;color:var(--text);font-family:inherit;text-align:left}
.rc:active{opacity:.5}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:5;animation:fade .2s both}
.sheet{width:100%;max-width:456px;animation:up .32s cubic-bezier(.2,.9,.2,1) both}
.sheet .grp{background:#242428;border-radius:16px;overflow:hidden;margin-bottom:8px}
.sheet .ttl{padding:14px 16px;text-align:center;color:var(--muted);font-size:13px;border-bottom:1px solid #34343a}
.sheet button{width:100%;padding:17px;border:none;background:none;color:var(--text);font:inherit;font-size:18px;border-bottom:1px solid #34343a}
.sheet button:last-child{border:none}
.sheet button:active{background:#2e2e33}
.sheet .del{color:#ff5a52}
.sheet .cancel{font-weight:600}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:600;letter-spacing:-.2px;margin-bottom:26px}
.brand img{border-radius:10px}
.sr{background:var(--card);border-radius:18px;overflow:hidden;margin:-2px 0 12px}
.sr:empty{display:none}
.sri{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;background:none;border:none;border-bottom:1px solid var(--card2);
  color:var(--text);font:inherit;text-align:left;animation:in .3s both}
.sri:last-child{border:none}
.sri:active{background:var(--card2)}
.sri img,.sri i{width:38px;height:57px;border-radius:6px;object-fit:cover;background:var(--card2);flex:none}
.sri b{display:block;font-size:16px;font-weight:500}
.sri small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.sri div{min-width:0}.sri b,.sri small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc{align-items:center}
.rc span{display:flex;align-items:center;gap:10px;min-width:0}
.rc span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc img{width:26px;height:39px;border-radius:4px;object-fit:cover;flex:none}
.poster{display:block;width:118px;height:177px;object-fit:cover;border-radius:14px;margin:0 auto 18px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.film small{display:block;text-transform:none;letter-spacing:0;font-size:13px;margin-top:3px;opacity:.8}
.credit{margin-top:30px;text-align:center;color:#55555a;font-size:12px}
.credit a{color:inherit}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="back hide" id="back" aria-label="Voltar">‹</button>
    <div class="bar hide" id="bar"><i id="fill"></i></div>
  </div>
  <div class="stage" id="stage"></div>
</div>

<script>
// A busca de filmes passa por api/search.js (função no servidor). A chave do TMDB fica só lá, nunca neste arquivo.
const IMG='https://image.tmdb.org/t/p/';

const V=[1,.78,.55,.3,.05];
const BASE = [
  {q:'Como você saiu do filme?', w:3, o:['Apaixonado','Feliz, gostei bastante','Satisfeito, foi ok','Meio frustrado','Decepcionado']},
  {q:'Prendeu sua atenção?', w:2, o:['O tempo todo','Quase o tempo todo','Indo e voltando','Só em poucas partes','Quase nada']},
  {q:'Sentiu alguma coisa?', s:'Riu, chorou, ficou tenso, se arrepiou…', w:2, o:['Muito, me pegou forte','Bastante','Um pouco','Bem pouco','Nada']},
  {q:'Vai ficar na sua cabeça?', w:2, o:['Por anos','Por semanas','Por uns dias','Até amanhã','Já esqueci']},
  {q:'Veria de novo?', w:2, o:['Hoje mesmo','Com certeza, um dia','Talvez','Difícil','Nunca']},
  {q:'Algo te impressionou?', s:'Uma cena, uma atuação, uma imagem, a música…', w:1, o:['Quase tudo','Várias coisas','Uma coisa ou outra','Quase nada','Nada']},
  {q:'Recomendaria?', w:1, o:['Pra todo mundo','Pra maioria','Pra quem curte o estilo','Pra poucos','Pra ninguém']},
];
const CLASSIC = [
  {q:'Envelheceu bem?', s:'Assistindo hoje, como ele se sai?', w:1.5, o:['Parece feito hoje','Bem, com um detalhe ou outro','Dá pra sentir a idade','Bastante datado','Difícil de assistir hoje']},
  {q:'Pra você, a fama é merecida?', s:'Esquece o que os outros dizem.', w:1.5, key:'fama', o:['Totalmente','Em boa parte','Mais ou menos','Pouco','Não entendi a fama']},
];
const REWATCH = [
  {q:'Como foi rever?', s:'Comparando com a última vez.', w:2, o:['Ainda melhor','Tão bom quanto','Um pouco menos','Bem menos','Perdeu a graça']},
];
const LABELS={5:'Obra-prima',4.5:'Excelente',4:'Muito bom',3.5:'Bom',3:'Legal',2.5:'Mediano',2:'Fraco',1.5:'Ruim',1:'Muito ruim',.5:'Desastre'};
const STAR='M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z';

let QS=BASE, step=-1, ans=[], title='', classic=false, stars=3, base=3, rival=null, saved=false, rewatch=null, replaced=null, movie=null;
const sameFilm=h=>(movie&&h.id)?h.id===movie.id:h.t.toLowerCase()===title.toLowerCase();
const buildQS=()=>BASE.concat(rewatch?REWATCH:[],classic?CLASSIC:[]);
const stage=document.getElementById('stage'), back=document.getElementById('back'), bar=document.getElementById('bar'), fill=document.getElementById('fill');
const esc=s=>s.replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const fmt=n=>String(n).replace('.',',');
const clamp=n=>Math.min(5,Math.max(.5,n));

function loadH(){try{return JSON.parse(localStorage.getItem('notaFilmeV2')||'[]')}catch(e){return[]}}
function saveH(){try{localStorage.setItem('notaFilmeV2',JSON.stringify(hist.slice(0,40)))}catch(e){}}
let hist=loadH();

function show(html,after){
  const old=stage.firstElementChild;
  const put=()=>{stage.innerHTML='<div class="screen">'+html+'</div>'; delete stage.dataset.lock; after&&after();};
  if(old){old.classList.add('out'); setTimeout(put,180);} else put();
}
function chrome(mode){ // home | q | cmp | res
  back.classList.toggle('hide',mode==='home');
  bar.classList.toggle('hide',mode==='home'||mode==='res');
  fill.style.width=(mode==='q'?step/QS.length*100:100)+'%';
}
function pick(cb){
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(stage.dataset.lock) return; stage.dataset.lock=1;
    stage.querySelectorAll('.opt').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    setTimeout(()=>cb(+b.dataset.i),260);
  });
}

function home(){
  step=-1; ans=[]; saved=false; rival=null; rewatch=null; replaced=null; chrome('home');
  const rec=hist.slice(0,8).map((h,i)=>`<button class="rc" data-i="${i}"><span>${h.img?`<img src="${IMG}w92${h.img}" alt="" onerror="this.remove()">`:''}<em>${esc(h.t)}</em></span><b>${h.n>1?'↻ ':''}★ ${fmt(h.s)}</b></button>`).join('');
  show(`<div class="brand"><img src="logo.svg" alt="" width="40" height="40">Lanterninha</div>
    <h1>Que nota<br>dar pro filme?</h1>
    <p class="sub">Perguntas rápidas sobre o que você sentiu.</p>
    <input type="text" id="t" placeholder="Nome do filme" maxlength="80" value="${esc(title)}" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="sr" id="sr"></div>
    <button class="sw${classic?' on':''}" id="sw" role="switch" aria-checked="${classic}">Clássico ou filme antigo<i></i></button>
    <button class="cta" id="go">Começar</button>
    ${rec?`<div class="recent"><h3>Recentes</h3>${rec}</div>`:''}
    <p class="credit">Dados e imagens de filmes: <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a></p>`,()=>{
    setupSearch();
    const sw=document.getElementById('sw');
    sw.onclick=()=>{classic=!classic; sw.classList.toggle('on',classic); sw.setAttribute('aria-checked',classic);};
    stage.querySelectorAll('.rc').forEach(b=>b.onclick=()=>sheet(+b.dataset.i));
    document.getElementById('go').onclick=()=>{title=document.getElementById('t').value.trim(); rewatch=title?hist.find(sameFilm)||null:null; QS=buildQS(); step=0; question();};
  });
}

function setupSearch(){
  const inp=document.getElementById('t'), box=document.getElementById('sr'), sw=document.getElementById('sw');
  let timer=null, ctl=null;
  inp.oninput=()=>{
    movie=null; clearTimeout(timer); if(ctl) ctl.abort();
    const q=inp.value.trim();
    if(q.length<2){box.innerHTML=''; return;}
    timer=setTimeout(async()=>{
      try{
        ctl=new AbortController();
        const r=await fetch('api/search?q='+encodeURIComponent(q),{signal:ctl.signal});
        if(!r.ok) throw 0;
        const list=(await r.json()).results||[];
        if(inp.value.trim()!==q) return;
        box.innerHTML=list.map((m,i)=>`<button class="sri" data-i="${i}">${m.poster?`<img src="${IMG}w92${m.poster}" alt="" loading="lazy">`:'<i></i>'}
          <div><b>${esc(m.title)}</b><small>${esc([m.original!==m.title?m.original:'',m.year].filter(Boolean).join(' · '))}</small></div></button>`).join('');
        box.querySelectorAll('.sri').forEach(b=>b.onclick=()=>{
          movie=list[+b.dataset.i]; inp.value=movie.title; box.innerHTML=''; inp.blur();
          if(movie.year&&+movie.year<=new Date().getFullYear()-35&&!classic){classic=true; sw.classList.add('on'); sw.setAttribute('aria-checked',true);}
        });
      }catch(e){ if(!e||e.name!=='AbortError') box.innerHTML=''; }
    },320);
  };
}

function sheet(i){
  const h=hist[i]; if(!h) return;
  const d=document.createElement('div'); d.className='dim';
  d.innerHTML=`<div class="sheet"><div class="grp"><div class="ttl">${esc(h.t)} · ★ ${fmt(h.s)}</div>
    <button data-a="re">Reassisti</button><button data-a="redo">Corrigir avaliação</button><button class="del" data-a="del">Apagar</button></div>
    <div class="grp"><button class="cancel" data-a="x">Cancelar</button></div></div>`;
  d.onclick=e=>{
    const a=e.target.dataset.a; if(!a&&e.target!==d) return;
    d.remove();
    if(a==='del'){hist.splice(i,1); saveH(); home();}
    if(a==='redo'||a==='re'){title=h.t; movie=h.id?{id:h.id,title:h.t,original:h.o,year:h.y,poster:h.img}:null; classic=!!h.c; rewatch=a==='re'?h:null; QS=buildQS(); step=0; ans=[]; question();}
  };
  document.body.appendChild(d);
}

function question(){
  chrome('q');
  const Q=QS[step];
  show(`<div class="q">${Q.q}</div><p class="sub">${Q.s||'&nbsp;'}</p>
    <div class="opts">${Q.o.map((o,i)=>`<button class="opt${ans[step]===i?' on':''}" data-i="${i}">${o}</button>`).join('')}</div>`,
    ()=>pick(i=>{ans[step]=i; step++; step<QS.length?question():afterQuestions();}));
}

function compute(){
  let s=0,w=0; QS.forEach((Q,i)=>{s+=V[ans[i]]*Q.w; w+=Q.w;});
  return clamp(Math.round((.5+(s/w)*4.5)*2)/2);
}
function afterQuestions(){
  base=stars=compute();
  const ok=h=>!sameFilm(h)&&Math.abs(h.s-base)<=.5;
  rival=hist.find(h=>ok(h)&&!!h.c===classic)||hist.find(ok)||null;
  rival?compare():result(true);
}
function compare(){
  chrome('cmp');
  show(`<div class="q">Qual te marcou mais?</div><p class="sub">Se tivesse que escolher um pra ficar na memória.</p>
    <div class="opts"><button class="opt" data-i="0">${esc(title||'Este filme')}</button><button class="opt" data-i="2">${esc(rival.t)}</button><button class="opt" data-i="1">Empate</button><button class="opt" data-i="3" style="background:none;color:var(--muted);text-align:center">Não dá pra comparar</button></div>`,
    ()=>pick(i=>{
      if(i===0&&stars<=rival.s) stars=clamp(rival.s+.5);
      if(i===1) stars=rival.s;
      if(i===2&&stars>=rival.s) stars=clamp(rival.s-.5);
      base=stars; result(true);
    }));
}

function starsHTML(n,anim){
  return [0,1,2,3,4].map(i=>{const f=Math.max(0,Math.min(1,n-i))*100;
    return `<div class="star" style="animation-delay:${anim?i*90:0}ms;${anim?'':'animation:none'}">
      <svg viewBox="0 0 24 24"><path d="${STAR}" fill="#2c2c30"/></svg>
      <div class="f" style="width:${f}%"><svg viewBox="0 0 24 24"><path d="${STAR}" fill="#e3b468"/></svg></div></div>`}).join('');
}
function seal(){
  if(!classic) return '';
  return stars>=4?'Clássico que merece a fama':stars>=3?'Respeito mais do que amo':'Importante, mas não é pra mim';
}
function rw(){
  if(!rewatch) return '';
  const d=stars-rewatch.s;
  return 'Antes ★ '+fmt(rewatch.s)+' · '+(d>0?'Cresceu na revisão':d<0?'Caiu na revisão':'Continua igual');
}
function result(){
  if(title&&!saved){const same=sameFilm;
    replaced=hist.find(same)||null; hist=hist.filter(h=>!same(h));
    const e={t:title,s:stars,c:classic}; if(movie){e.id=movie.id; e.y=movie.year; e.o=movie.original; e.img=movie.poster;} if(rewatch){e.p=rewatch.s; e.n=(rewatch.n||1)+1;} else if(replaced&&replaced.n){e.p=replaced.p; e.n=replaced.n;}
    hist.unshift(e); saved=true; saveH();}
  chrome('res');
  show(`<div class="center">
    ${movie&&movie.poster?`<img class="poster" src="${IMG}w342${movie.poster}" alt="" onerror="this.remove()">`:''}
    <div class="film">${esc(title)}${movie?`<small>${esc([movie.original&&movie.original!==title?movie.original:'',movie.year||''].filter(Boolean).join(' · '))}</small>`:''}</div>
    <div class="stars" id="st">${starsHTML(stars,true)}</div>
    <div class="num" id="num">${fmt(stars)}</div>
    <div class="label" id="lb">${LABELS[stars]}</div>
    ${rewatch?`<div><div class="seal" id="rw">${rw()}</div></div>`:''}
    ${classic?`<div class="seal" id="seal">${seal()}</div>`:''}
    <div class="adj"><button id="minus" aria-label="Diminuir meia estrela">−</button><small id="hint">Não concorda? Ajuste.</small><button id="plus" aria-label="Aumentar meia estrela">+</button></div>
    <button class="cta" id="again">Avaliar outro filme</button></div>`,()=>{
    const upd=d=>{stars=clamp(stars+d);
      document.getElementById('st').innerHTML=starsHTML(stars,false);
      document.getElementById('num').textContent=fmt(stars);
      document.getElementById('lb').textContent=LABELS[stars];
      const se=document.getElementById('seal'); if(se) se.textContent=seal();
      const re=document.getElementById('rw'); if(re) re.textContent=rw();
      document.getElementById('hint').textContent=stars===base?'Não concorda? Ajuste.':'Sugestão era '+fmt(base);
      if(saved&&hist[0]){hist[0].s=stars; saveH();}
    };
    document.getElementById('minus').onclick=()=>upd(-.5);
    document.getElementById('plus').onclick=()=>upd(.5);
    document.getElementById('again').onclick=()=>{title=''; movie=null; classic=false; home();};
  });
}

back.onclick=()=>{
  if(stage.dataset.lock) return;
  if(step>=QS.length){ if(saved){hist.shift(); if(replaced) hist.unshift(replaced); replaced=null; saved=false; saveH();} step=QS.length-1; question(); }
  else if(step>0){step--; question();}
  else home();
};
home();
</script>
</body>
</html>
