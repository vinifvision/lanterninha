# Roda a checagem de tipos e os testes em todo pull request e em todo push na main.
name: Testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Checar os tipos (TypeScript)
        run: npm run typecheck

      - name: Rodar os testes
        run: npm test
